# Free on all GitHub repos: weekly PRs for vulnerable or outdated dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions (Next 16, TypeScript 7, ...) contain breaking changes and are
    # upgraded deliberately, not by bot. Security fixes still arrive as patches.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
